name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mobile:
    name: Mobile (lint + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  database:
    name: Database (migrations aplicam do zero)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Sem `version`: a action usa a versão do supabase fixada no package-lock.json.
      - uses: supabase/setup-cli@v3
      - run: supabase db start
      - run: supabase db lint --level error
